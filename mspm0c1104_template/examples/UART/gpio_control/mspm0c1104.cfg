# Configuración OpenOCD para MSPM0C1104
source [find interface/cmsis-dap.cfg]

# Configuración del target
set CHIPNAME mspm0c1104
set CPUTAPID 0x6BA02477

# Configuración SWD
transport select swd
swd newdap $CHIPNAME cpu -expected-id $CPUTAPID

# Target configuration
set _TARGETNAME $CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $CHIPNAME.dap

# Configuración de memoria
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0

# Configuración de flash - MSPM0C1104 tiene 32KB de flash
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME stellaris 0x00000000 0x8000 0 0 $_TARGETNAME

# Configuración de clock
adapter speed 1000

# Reset configuration
reset_config srst_only
